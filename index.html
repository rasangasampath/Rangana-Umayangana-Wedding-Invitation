
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rangana & Umayangana | Wedding Invitation</title>

    <meta name="description" content="Wedding invitation of Rangana and Umayangana.">

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Base styles */
        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: #f4f0eb;
            font-family: Georgia, "Times New Roman", serif;
            overflow-x: hidden;
        }

        /* Main invitation container */
        .invitation {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0px;
        }

        /* Individual invitation pages */
        .page {
            width: 100%;
            margin: 0 auto 0px;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* Responsive images */
        .page img {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Large desktop screens */
        @media screen and (min-width: 1200px) {
            .invitation {
                max-width: 1100px;
                padding: 30px;
            }

            .page {
                margin-bottom: 30px;
            }
        }

        /* Laptop and tablet screens */
        @media screen and (max-width: 1024px) {
            .invitation {
                max-width: 100%;
                padding: 16px;
            }

            .page {
                margin-bottom: 20px;
            }
        }

        /* Mobile screens */
        @media screen and (max-width: 600px) {
            body {
                background-color: #ffffff;
            }

            .invitation {
                width: 100%;
                padding: 0;
            }

            .page {
                width: 100%;
                margin-bottom: 8px;
            }

            .page img {
                width: 100%;
                height: auto;
            }
        }

        /* Very small mobile screens */
        @media screen and (max-width: 360px) {
            .page {
                margin-bottom: 4px;
            }
        }

        /* Print settings */
        @media print {
            @page {
                size: auto;
                margin: 0;
            }

            body {
                background: #ffffff;
            }

            .invitation {
                width: 100%;
                max-width: none;
                padding: 0;
            }

            .page {
                width: 100%;
                margin: 0;
                overflow: visible;
                break-after: page;
                page-break-after: always;
            }

            .page:last-child {
                break-after: auto;
                page-break-after: auto;
            }

            .page img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>

    <main class="invitation">

        <!-- Page 1 -->
        <section class="page">
            <img
                src="Uma-01.jpg"
                alt="Rangana and Umayangana wedding invitation cover"
                loading="eager"
                fetchpriority="high"
            >
        </section>

        <!-- Page 2 -->
        <section class="page">
            <img
                src="Uma-02.jpg"
                alt="Wedding invitation message"
                loading="lazy"
            >
        </section>

        <!-- Page 3 -->
        <section class="page">
            <img
                src="Uma-03.jpg"
                alt="Wedding date, time and venue details"
                loading="lazy"
            >
        </section>

        <!-- Page 4 -->
        <section class="page">
            <img
                src="Uma-04.jpg"
                alt="Wedding words of blessing"
                loading="lazy"
            >
        </section>

        <!-- Page 5 -->
        <section class="page">
            <img
                src="Uma-05.jpg"
                alt="Wedding invitation final page"
                loading="lazy"
            >
        </section>

    </main>

</body>
</html>
